# ============================================================
# PORTAINER SERVER
# ============================================================

server {
    if ($host = portainer.mtyn.ir) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name portainer.mtyn.ir;

    return 301 https://$host$request_uri;


}

server {
    listen 443 ssl;
    server_name portainer.mtyn.ir;
    ssl_certificate /etc/letsencrypt/live/portainer.mtyn.ir/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/portainer.mtyn.ir/privkey.pem; # managed by Certbot


    location / {
        proxy_pass https://192.168.7.120:9443;

        proxy_ssl_verify off;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

}


# ============================================================
# PORTAINER EDGE / AGENT
# ============================================================
#
# Only keep this block if 8000 is actually being used
# by your Portainer Edge Agent.
#

server {
    listen 443 ssl;
    server_name portainer.edge.mtyn.ir;
    ssl_certificate /etc/letsencrypt/live/portainer.edge.mtyn.ir/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/portainer.edge.mtyn.ir/privkey.pem; # managed by Certbot


    location / {
        proxy_pass http://192.168.7.120:8000;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

}

