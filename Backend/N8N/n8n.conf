        #################
        #      n8n      #
        #################
        
        server {
        
            server_name n8n.mtyn.ir;
        
            location / {
            proxy_pass http://192.168.7.169:5678;
            
            # Required headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        
            # Timeouts
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 3600s;
        }
        
        
            listen 443 ssl; # managed by Certbot
            ssl_certificate /etc/letsencrypt/live/n8n.mtyn.ir/fullchain.pem; # managed by Certbot
            ssl_certificate_key /etc/letsencrypt/live/n8n.mtyn.ir/privkey.pem; # managed by Certbot
            include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
            ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
        
        }
        
        
